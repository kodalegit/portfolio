<text x="690" y="546" font-size="15.1" text-anchor="start" font-weight="normal" style="fill:var(--ink-2)">of the main conversation.</text>
<text x="40" y="690" font-size="15.1" text-anchor="start" font-weight="normal" style="fill:var(--d-orange)">Not yet tested. The default agent was tested as a prototype.</text>
